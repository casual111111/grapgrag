# GraphRAG configuration - flash project format
# Model runtime values and secrets are loaded from .env.

### LLM Settings ###

completion_models:
  default_completion_model:
    model_provider: ${GRAPHRAG_CHAT_MODEL_PROVIDER}
    model: ${GRAPHRAG_CHAT_MODEL}
    auth_method: ${GRAPHRAG_MODEL_AUTH_METHOD}
    api_key: ${GRAPHRAG_CHAT_API_KEY}
    api_base: ${GRAPHRAG_CHAT_API_BASE}
    request_timeout: ${GRAPHRAG_CHAT_TIMEOUT}
    max_tokens: ${GRAPHRAG_CHAT_MAX_TOKENS}
    retry:
      type: ${GRAPHRAG_MODEL_RETRY_TYPE}
      max_retries: ${GRAPHRAG_MODEL_MAX_RETRIES}
    concurrent_requests: ${GRAPHRAG_CONCURRENT_REQUESTS}
    async_mode: ${GRAPHRAG_ASYNC_MODE}

embedding_models:
  default_embedding_model:
    model_provider: ${GRAPHRAG_EMBEDDING_MODEL_PROVIDER}
    model: ${GRAPHRAG_EMBEDDING_MODEL}
    auth_method: ${GRAPHRAG_MODEL_AUTH_METHOD}
    api_key: ${GRAPHRAG_EMBEDDING_API_KEY}
    api_base: ${GRAPHRAG_EMBEDDING_API_BASE}
    retry:
      type: ${GRAPHRAG_MODEL_RETRY_TYPE}
      max_retries: ${GRAPHRAG_MODEL_MAX_RETRIES}
    concurrent_requests: ${GRAPHRAG_CONCURRENT_REQUESTS}
    async_mode: ${GRAPHRAG_ASYNC_MODE}

### Document processing ###

input:
  type: text
  file_type: text
  file_pattern: ".*\\.md$$"

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

cache:
  type: json
  base_dir: "cache"

reporting:
  type: file
  base_dir: "logs"

vector_store:
  vector_size: 1024
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default

### Workflow settings ###

workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - extract_covariates
  - create_final_text_units
  - generate_text_embeddings

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store
  batch_size: ${GRAPHRAG_EMBEDDING_BATCH_SIZE}
  names:
    - entity_description
    - text_unit_text

extract_graph:
  model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [concept, state, event, rule, formula, config_param]
  max_gleanings: 0

summarize_descriptions:
  model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_claims:
  enabled: false

snapshots:
  graphml: false
  embeddings: false
  raw_graph: false

### Query settings ###

local_search:
  chat_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"
  community_prop: 0.0
  text_unit_prop: 0.5
  max_context_tokens: 24000
  top_k_entities: 10
  top_k_relationships: 18
